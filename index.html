<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Рейтинг продаж</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#282b28;background:#f3efe4}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:25px 16px 100px}h1{font-size:28px;margin:0 0 4px}small,.muted{color:#87877f}.subtitle{margin-bottom:22px}.panel{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #423e3110}.label{font-size:12px;font-weight:800;letter-spacing:.06em;color:#88897f;margin:0 0 13px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:0;background:#f1f0e9;border-radius:12px;padding:11px 13px;font-weight:700;color:#5c605b;cursor:pointer}.tab.active{background:#ddefe6;color:#247a56}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:#f5f3ed;border-radius:15px;padding:13px 9px}.stat span{font-size:11px;color:#88877f;display:block}.stat strong{font-size:18px;display:block;margin-top:4px}.leader{background:#e2f2e9;border-radius:20px;padding:20px;margin-top:18px}.leader .eyebrow{font-size:11px;letter-spacing:.04em;color:#408f6d;font-weight:800}.person{display:flex;align-items:center;justify-content:space-between;gap:12px}.person h3{font-size:18px;overflow-wrap:anywhere;margin:10px 0}.percent{font-size:26px;font-weight:800}.leader .percent{color:#27956a}.meta{font-size:12px;color:#6f786e}.rank{border:1px solid #e6e4dc;border-radius:19px;padding:16px;margin-top:12px;cursor:pointer}.rank summary{list-style:none}.rank summary::-webkit-details-marker{display:none}.rank .pos{color:#9b9a92;font-size:12px;font-weight:700}.bar{height:8px;background:#e9e7df;border-radius:9px;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:#72b496;border-radius:9px}.detail{border-top:1px solid #e9e8e2;margin-top:14px;padding-top:13px;font-size:13px;line-height:1.9;color:#666}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:14px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:28px;font-size:13px;color:#74776f}.bottom b{color:#318663}.empty{padding:25px 0;text-align:center;color:#85857c}#demo{background:#fff4d9;color:#84651b;border-radius:10px;padding:10px 13px;font-size:12px;margin-top:12px}
</style></head><body><main><h1>Итоги продаж</h1><div class="subtitle muted">🏆 Рейтинг торговых представителей</div><div id="demo">Проверяем доступ через Telegram…</div><div id="auth-error" role="alert" style="display:none;background:#ffe7e4;color:#842d27;border-radius:12px;padding:16px;margin-top:12px"></div><div id="dashboard" style="display:none"><section class="panel"><div class="label">ВЫБЕРИТЕ БРЕНД</div><div class="tabs" id="brands"></div><div class="label" style="margin-top:19px">ПЕРИОД</div><div class="tabs" id="periods"></div></section><section class="panel"><div class="label">📊 ОБЩИЕ ПОКАЗАТЕЛИ</div><div class="stats" id="stats"></div></section><section class="panel"><div class="person"><div class="label">🏆 РЕЙТИНГ ПРЕДСТАВИТЕЛЕЙ</div><strong id="count"></strong></div><div id="ranking"></div></section></div></main><nav class="bottom" id="bottom-nav" style="display:none"><span>🏷 Бренды</span><b>📊 Рейтинг</b><span>📅 Период</span></nav>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const rows=[
{year:2026,month:8,brand:'Рахат',rep:'Ali',plan:100000,sales:100000},{year:2026,month:8,brand:'Рахат',rep:'Vali',plan:100000,sales:90000},{year:2026,month:8,brand:'Сауле',rep:'Mansur',plan:100000,sales:110000},{year:2026,month:8,brand:'Сауле',rep:'Abdumutallib',plan:100000,sales:50000},
{year:2026,month:9,brand:'Рахат',rep:'Ali',plan:100000,sales:80000},{year:2026,month:9,brand:'Рахат',rep:'Vali',plan:100000,sales:90000},{year:2026,month:9,brand:'Сауле',rep:'Mansur',plan:100000,sales:100000},{year:2026,month:9,brand:'Сауле',rep:'Abdumutallib',plan:100000,sales:110000},
{year:2026,month:10,brand:'Рахат',rep:'Ali',plan:100000,sales:50000},{year:2026,month:10,brand:'Рахат',rep:'Vali',plan:100000,sales:50000},{year:2026,month:10,brand:'Сауле',rep:'Mansur',plan:100000,sales:50000},{year:2026,month:10,brand:'Сауле',rep:'Abdumutallib',plan:100000,sales:50000}];
let brand='Все бренды',period='Месяц';const now={year:2026,month:10};const fmt=n=>Math.round(n).toLocaleString('ru-RU');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const brands=['Все бренды',...new Set(rows.map(r=>r.brand))];document.getElementById('brands').innerHTML=brands.map(b=>`<button class="tab ${brand===b?'active':''}" data-brand="${esc(b)}">${esc(b)}</button>`).join('');document.querySelectorAll('[data-brand]').forEach(el=>el.onclick=()=>{brand=el.dataset.brand;render()});document.getElementById('periods').innerHTML=['Месяц','Квартал','Год'].map(p=>`<button class="tab ${period===p?'active':''}" data-period="${p}">${p}</button>`).join('');document.querySelectorAll('[data-period]').forEach(el=>el.onclick=()=>{period=el.dataset.period;render()});
const subset=rows.filter(r=>r.year===now.year&&(brand==='Все бренды'||r.brand===brand)&&(period==='Год'||period==='Квартал'&&r.month>=10&&r.month<=12||period==='Месяц'&&r.month===now.month));const people=new Map();let totalPlan=0,totalSales=0;for(const r of subset){totalPlan+=r.plan;totalSales+=r.sales;const k=r.rep.toLowerCase(),v=people.get(k)||{name:r.rep,plan:0,sales:0};v.plan+=r.plan;v.sales+=r.sales;people.set(k,v)}const ranked=[...people.values()].map(p=>({...p,pct:p.plan?100*p.sales/p.plan:0})).sort((a,b)=>b.pct-a.pct||b.sales-a.sales);document.getElementById('stats').innerHTML=[['План',fmt(totalPlan)],['Продажи',fmt(totalSales)],['Выполнение',`${totalPlan?(100*totalSales/totalPlan).toFixed(1):'0.0'}%`]].map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('');document.getElementById('count').textContent=ranked.length+' чел.';
let html='';ranked.forEach((p,i)=>{const details=`<div class="detail">🎯 План: <b>${fmt(p.plan)}</b><br>💰 Продажи: <b>${fmt(p.sales)}</b><br>📈 Выполнение: <b>${p.pct.toFixed(1)}%</b></div>`;if(i===0){html+=`<div class="leader"><div class="eyebrow">🥇 ЛУЧШИЙ РЕЗУЛЬТАТ</div><div class="person"><h3>${esc(p.name)}</h3><div class="percent">${p.pct.toFixed(1)}%</div></div><div class="meta">План ${fmt(p.plan)} · Продажи ${fmt(p.sales)}</div><div class="bar"><div style="width:${Math.max(0,Math.min(100,p.pct))}%"></div></div></div>`}else{html+=`<details class="rank"><summary><div class="pos">${i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div><div class="person"><h3>${esc(p.name)}</h3><strong>${p.pct.toFixed(1)}% ▾</strong></div><div class="bar"><div style="width:${Math.max(0,Math.min(100,p.pct))}%"></div></div></summary>${details}</details>`}});document.getElementById('ranking').innerHTML=html||'<div class="empty">Нет данных за выбранный период</div>'}
async function startApp(){
  const status=document.getElementById('demo');
  const error=document.getElementById('auth-error');
  const tg=window.Telegram?.WebApp;
  if(!tg?.initData){
    status.textContent='Доступ только через Telegram. Откройте приложение кнопкой в @ratesr_bot.';
    return;
  }
  tg.ready();
  try{
    const response=await fetch('https://sales-rating-api.rustamrahmatov.workers.dev/auth',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:tg.initData}),cache:'no-store'
    });
    const result=await response.json();
    if(!response.ok||result.authorized!==true){
      throw new Error(
  (result.error || 'Доступ запрещён') +
  (result.telegramErrorCode
    ? ' | Код: ' + result.telegramErrorCode
    : '') +
  (result.telegramDescription
    ? ' | Причина: ' + result.telegramDescription
    : '')
);
    }
    status.textContent='✓ Доступ подтверждён. Пока отображаются демонстрационные данные, не Google Sheets.';
    document.getElementById('dashboard').style.display='block';
    document.getElementById('bottom-nav').style.display='flex';
    render();
  }catch(e){
    status.textContent='Авторизация не пройдена.';
    error.textContent='Ошибка: '+(e?.message||'Не удалось проверить доступ');
    error.style.display='block';
  }
}
startApp();
</script></body></html>
